name: Backend CI

# Render deploys the linked main commit after this workflow passes.
# Enable Settings > Auto-Deploy > After CI Checks Pass in Render.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend checks
    # MongoDB 8 can exit at startup on recent Ubuntu 24.04 runner kernels.
    # Use the workaround recommended in actions/runner-images#15005.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      NODE_ENV: test
      # This database exists only on the disposable GitHub runner, never Atlas.
      # The existing Jest setup assigns isolated database names to test suites.
      MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=hostelhiveCI&directConnection=true
      RUN_LIVE_STRIPE_TESTS: 'false'

    steps:
      - name: Check out this commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies including development tools
        run: npm ci --include=dev --no-audit --no-fund

      - name: Lint backend source
        run: npm run lint

      - name: Check JavaScript syntax
        run: git ls-files -z -- '*.js' '*.cjs' '*.mjs' | xargs -0 -r -n 1 node --check

      - name: Start isolated transaction-capable MongoDB
        timeout-minutes: 5
        run: |
          uname -sr
          docker run --detach --name hostelhive-ci-mongo \
            --publish 127.0.0.1:27017:27017 \
            mongo:8.0-noble --replSet hostelhiveCI --bind_ip_all

          # Use the same driver/network path as Jest instead of requiring mongosh
          # to work inside the image. No production settings are loaded here.
          node <<'NODE'
          const { MongoClient } = require('mongoose').mongo;
          const { execFileSync } = require('node:child_process');
          const { setTimeout: delay } = require('node:timers/promises');
          const replicaSet = 'hostelhiveCI';
          // Omit replicaSet until initiation; connect directly to the IPv4 port.
          const bootstrapUri = 'mongodb://127.0.0.1:27017/?directConnection=true';

          async function withAdmin(action, uri = bootstrapUri) {
            const client = new MongoClient(uri, {
              serverSelectionTimeoutMS: 2000,
              connectTimeoutMS: 2000,
              socketTimeoutMS: 5000,
            });
            try {
              await client.connect();
              return await action(client.db('admin'));
            } finally {
              await client.close();
            }
          }

          async function waitFor(label, action) {
            const deadline = Date.now() + 90000;
            let lastError;
            let attempt = 0;
            while (Date.now() < deadline) {
              const running = execFileSync('docker', [
                'inspect', '--format', '{{.State.Running}}', 'hostelhive-ci-mongo',
              ], { encoding: 'utf8' }).trim();
              if (running !== 'true') {
                throw new Error(`CI MongoDB container stopped while waiting for ${label}. See container diagnostics below.`);
              }
              try {
                await action();
                console.log(`MongoDB ready: ${label}.`);
                return;
              } catch (error) {
                lastError = error;
                if (attempt++ % 5 === 0) {
                  console.log(`Waiting for ${label}: ${error.name}: ${error.message}`);
                }
              }
              await delay(2000);
            }
            throw new Error(`Timed out waiting for ${label}: ${lastError?.message || 'no response'}`);
          }

          async function main() {
            await waitFor('initial connection', () => withAdmin(db => db.command({ ping: 1 })));
            await withAdmin(db => db.command({
              replSetInitiate: {
                _id: replicaSet,
                members: [{ _id: 0, host: 'localhost:27017' }],
              },
            }));
            await waitFor('replica set primary', () => withAdmin(async db => {
              const hello = await db.command({ hello: 1 });
              if (!hello.isWritablePrimary || hello.setName !== replicaSet) {
                throw new Error('The expected replica set has not elected a writable primary yet.');
              }
            }));
            // Verify the exact replica-set URI that the existing tests will use.
            await withAdmin(db => db.command({ ping: 1 }), process.env.MONGO_URI);
            console.log('CI MongoDB replica set is ready for the existing tests.');
          }

          main().catch(error => {
            console.error(`CI MongoDB startup failed: ${error.name}: ${error.message}`);
            // Include the server's actual error in this failed step too, so it
            // is visible without expanding the separate diagnostics step.
            for (const args of [
              ['inspect', '--format', 'State: {{json .State}}', 'hostelhive-ci-mongo'],
              ['logs', 'hostelhive-ci-mongo'],
            ]) {
              try {
                execFileSync('docker', args, { stdio: 'inherit', timeout: 10000 });
              } catch {
                console.error('Could not retrieve one of the CI MongoDB diagnostics.');
              }
            }
            process.exitCode = 1;
          });
          NODE

      - name: Run existing automated tests
        run: npm test -- --ci

      - name: Show MongoDB diagnostics on failure
        if: failure()
        run: |
          if docker container inspect hostelhive-ci-mongo >/dev/null 2>&1; then
            docker inspect --format 'State: {{json .State}}' hostelhive-ci-mongo
            # Preserve startup errors as well as the most recent server output.
            docker logs hostelhive-ci-mongo
          fi

      - name: Remove temporary CI database
        if: always()
        run: |
          if docker container inspect hostelhive-ci-mongo >/dev/null 2>&1; then
            docker rm --force --volumes hostelhive-ci-mongo
          fi
